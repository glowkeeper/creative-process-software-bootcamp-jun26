name: Deploy Week 7 Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/project-tracker/week-07/showcase/**'
      - '.github/workflows/deploy-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/project-tracker/week-07/showcase

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/project-tracker/week-07/showcase/package-lock.json

      - name: Install Showcase dependencies
        run: npm ci

      - name: Build Showcase for GitHub Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload built Showcase
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/project-tracker/week-07/showcase/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Showcase to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
